name: Bug report
description: Something in the engine is wrong (scan, safety, trash, sizes).
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do **not** use this form for path-safety bypasses that could delete user data. Use [Security Advisories](https://github.com/DHANUSH-web/dcmmlib/security/advisories/new).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected vs actual behavior.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [macOS, Linux, Windows, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or tag
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Prefer `DCMM_HOME` fixtures, not your real home folder.
    validations:
      required: true
