name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            brew install ninja
          else
            sudo apt-get update
            sudo apt-get install -y ninja-build clang
          fi
      - name: Configure
        run: cmake --preset release
        env:
          CXX: clang++
          CC: clang
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release --output-on-failure
